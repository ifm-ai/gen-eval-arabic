configurations:
  deterministic:
    defaults:
      temperature: 0

  optimized:
    models:
      ###################### Gemma 4 ######################
      google/gemma-4-*B-it*:
        defaults:
          temperature: 1.0
          top_p: 0.95
          top_k: 64

      ###################### Qwen 3.5 & 3.6 & 3.8 ######################
      Qwen/Qwen3.5-2B:
        defaults:
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repetition_penalty: 1.0
        rules:
          - when:
              domain: coding
              mode: think
            set:
              temperature: 0.6
              presence_penalty: 0.0
          - when:
              mode: instruct
            set:
              temperature: 1.0
              top_p: 1.0
              top_k: 20
              presence_penalty: 2.0

      Qwen/Qwen3.5-4B:
        defaults:
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repetition_penalty: 1.0
        rules:
          - when:
              domain: coding
              mode: think
            set:
              temperature: 0.6
              presence_penalty: 0.0
          - when:
              mode: instruct
            set:
              temperature: 0.7
              top_p: 0.80


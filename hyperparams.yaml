              domain: coding
              mode: think
            set:
              temperature: 0.6
              presence_penalty: 0.0
          - when:
              domain: coding
              mode: instruct
            set: {} #intentionally left empty
          - when:
              mode: instruct
            set:
              temperature: 0.7
              top_p: 0.80

